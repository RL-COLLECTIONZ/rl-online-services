<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>R&L Online Services — Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .header {
            background: #0b1220;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 21px;
        }

        .header span {
            color: #22d3ee;
            font-size: 13px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 25px 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .stat h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .stat strong {
            font-size: 28px;
        }

        .toolbar {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .toolbar input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            font-size: 14px;
        }

        .orders {
            display: grid;
            gap: 15px;
        }

        .order {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }


        .order-date {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        .customer-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .customer-summary > div {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
        }

        .customer-summary strong {
            display: block;
            margin-top: 5px;
            color: #1e293b;
            word-break: break-word;
        }

        .view-details-btn {
            width: 100%;
            border: none;
            background: #2563eb;
            color: white;
            padding: 11px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .view-details-btn:hover {
            background: #1d4ed8;
        }

        .order-details {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #e2e8f0;
        }

        .order-details h3 {
            font-size: 15px;
            color: #1e293b;
            margin: 18px 0 10px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .detail-label {
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
        }

        .detail-value {
            color: #1e293b;
            font-size: 14px;
            text-align: right;
            word-break: break-word;
        }

        .message-box {
            background: #f8fafc;
            border-radius: 8px;
            padding: 12px;
            color: #334155;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 700px) {
            .customer-summary {
                grid-template-columns: 1fr;
            }

            .detail-row {
                flex-direction: column;
                gap: 4px;
            }

            .detail-value {
                text-align: left;
            }
        }

        .order-id {
            font-weight: bold;
            color: #0284c7;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #dcfce7;
            color: #166534;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 14px;
        }

        .info div {
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
        }

        .label {
            display: block;
            color: #64748b;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .loading,
        .empty,
        .error {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .info {
                grid-template-columns: 1fr;
            }

            .header {
                align-items: flex-start;
                gap: 5px;
                flex-direction: column;
            }
        }
      .logout-btn {
  background: #ef4444;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s ease;
}

.logout-btn:hover {
  background: #dc2626;
}
    </style>
</head>

<body>

<header class="header">
    <div>
  <h1>R&L Online Services</h1>
  <span>Admin Dashboard</span>
</div>

<button onclick="logoutAdmin()" class="logout-btn">
  Logout
</button>

    <div>
        🟢 API Connected
    </div>
</header>

<main class="container">

    <section class="stats">
        <div class="stat">
            <h3>Total Orders</h3>
            <strong id="totalOrders">0</strong>
        </div>

        <div class="stat">
            <h3>New Orders</h3>
            <strong id="newOrders">0</strong>
        </div>

        <div class="stat">
            <h3>In Progress</h3>
            <strong id="progressOrders">0</strong>
        </div>

        <div class="stat">
            <h3>Completed</h3>
            <strong id="completedOrders">0</strong>
        </div>
    </section>

    <section class="toolbar">
        <input
            type="text"
            id="search"
            placeholder="Search by Order ID, name, phone or service..."
        >
    </section>

    <section id="orders" class="orders">
        <div class="loading">
            Loading orders...
        </div>
    </section>

</main>

<script>

  const adminToken = sessionStorage.getItem("rl_admin_token");

if (!adminToken) {
  window.location.href = "/admin-login.html";
}

function logoutAdmin() {
  sessionStorage.removeItem("rl_admin_token");
  window.location.replace("/admin-login.html");
}

// Automatically logout when JWT expires
function checkTokenExpiry() {
  const token = sessionStorage.getItem("rl_admin_token");

  if (!token) {
    logoutAdmin();
    return;
  }

  try {
    const payload = JSON.parse(atob(token.split(".")[1]));
    const expiryTime = payload.exp * 1000;
    const remainingTime = expiryTime - Date.now();

    if (remainingTime <= 0) {
      logoutAdmin();
      return;
    }

    setTimeout(logoutAdmin, remainingTime);

  } catch (error) {
    console.error("Invalid admin token.");
    logoutAdmin();
  }
}

checkTokenExpiry();
  
let allOrders = [];

async function loadOrders() {

    const ordersContainer = document.getElementById("orders");

    try {

        const token = sessionStorage.getItem("rl_admin_token");

const response = await fetch("/api/orders", {
  headers: {
    "Authorization": `Bearer ${token}`
  }
});

if (response.status === 401) {
  logoutAdmin();
  return;
}


        const result = await response.json();

if (!response.ok || !result.success) {
    throw new Error("Failed to load orders");
}

        allOrders = result.orders || [];

        updateStats(allOrders);

        displayOrders(allOrders);

    } catch (error) {

        console.error(error);

        ordersContainer.innerHTML = `
            <div class="error">
                ❌ Failed to load orders.<br>
                Make sure the R&L API server is running.
            </div>
        `;
    }
}


function updateStats(orders) {

    document.getElementById("totalOrders").textContent =
        orders.length;

    document.getElementById("newOrders").textContent =
        orders.filter(order => order.status === "NEW").length;

    const inProgressStatuses = [
        "QUOTATION",
        "PAYMENT_PENDING",
        "PAID",
        "PROCESSING",
        "CLIENT_REVIEW"
    ];

    document.getElementById("progressOrders").textContent =
        orders.filter(order =>
            inProgressStatuses.includes(order.status)
        ).length;

    document.getElementById("completedOrders").textContent =
        orders.filter(order => order.status === "COMPLETED").length;
}


function displayOrders(orders) {

    const container = document.getElementById("orders");

    if (!orders.length) {
        container.innerHTML = `
            <div class="empty">
                No orders found.
            </div>
        `;
        return;
    }

    container.innerHTML = orders.map(order => {

        const customer = order.customer || {};
        const payment = order.payment || {};
        const details = order.serviceDetails || {};

        const detailsHTML = Object.entries(details).map(([key, value]) => `
            <div class="detail-row">
                <span class="detail-label">${key}</span>
                <span class="detail-value">${value || "-"}</span>
            </div>
        `).join("");

        return `
            <article class="order">

                <div class="order-top">

                    <div>
                        <div class="order-id">
                            ${order.orderId || "-"}
                        </div>

                        <div class="order-date">
                            ${order.createdAt
                                ? new Date(order.createdAt).toLocaleString()
                                : "-"}
                        </div>
                    </div>

                    <div class="status">
                        ${order.status || "NEW"}
                    </div>

                </div>

                <div class="customer-summary">

                    <div>
                        <span class="label">Customer</span>
                        <strong>${customer.fullName || "-"}</strong>
                    </div>

                    <div>
                        <span class="label">Phone</span>
                        <strong>${customer.phone || "-"}</strong>
                    </div>

                    <div>
                        <span class="label">Service</span>
                        <strong>${order.service || "-"}</strong>
                    </div>

                </div>

                <button
                    type="button"
                    class="view-details-btn"
                    onclick="showOrderDetails('${order.orderId}')">
                    View Order Details
                </button>

                <div class="order-details" id="details-${order.orderId}" style="display:none;">

                    <h3>Customer Information</h3>

                    <div class="detail-row">
                        <span class="detail-label">Full Name</span>
                        <span class="detail-value">${customer.fullName || "-"}</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Phone</span>
                        <span class="detail-value">${customer.phone || "-"}</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Email</span>
                        <span class="detail-value">${customer.email || "-"}</span>
                    </div>

                    <h3>Service Information</h3>

                    <div class="detail-row">
                        <span class="detail-label">Service</span>
                        <span class="detail-value">${order.service || "-"}</span>
                    </div>

                    ${detailsHTML}

                    <h3>Order Message</h3>

                    <div class="message-box">
                        ${order.message || "No message provided."}
                    </div>

                    <h3>Payment</h3>

                    <div class="detail-row">
                        <span class="detail-label">Payment Status</span>
                        <span class="detail-value">${payment.status || "PENDING"}</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Amount</span>
                        <span class="detail-value">TSh ${Number(payment.amount || 0).toLocaleString()}</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Reference</span>
                        <span class="detail-value">${payment.reference || "-"}</span>
                    </div>

                    <h3>Order Status</h3>

                    <div class="detail-row">
                        <span class="detail-label">Current Status</span>
                        <span class="detail-value">${order.status || "NEW"}</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Admin Notes</span>
                        <span class="detail-value">${order.adminNotes || "No notes yet."}</span>
                    </div>

                </div>

            </article>
        `;

    }).join("");
}


function showOrderDetails(orderId) {

    const details = document.getElementById(`details-${orderId}`);

    if (!details) return;

    const button = details.previousElementSibling;

    if (details.style.display === "none") {

        details.style.display = "block";

        if (button) {
            button.textContent = "Hide Order Details";
        }

    } else {

        details.style.display = "none";

        if (button) {
            button.textContent = "View Order Details";
        }
    }
}


document.getElementById("search").addEventListener("input", function () {

    const searchTerm = this.value.toLowerCase();

    const filtered = allOrders.filter(order => {

        const customer = order.customer || {};

        return (
            (order.orderId || "").toLowerCase().includes(searchTerm) ||
            (customer.fullName || "").toLowerCase().includes(searchTerm) ||
            (customer.phone || "").toLowerCase().includes(searchTerm) ||
            (order.service || "").toLowerCase().includes(searchTerm)
        );

    });

    displayOrders(filtered);
});


loadOrders();

</script>

</body>
</html>
