<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>R&L Online Services — Admin Dashboard</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

.header {
    background: #0b1220;
    color: white;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.header-left h1 {
    font-size: 21px;
}

.header-left span {
    color: #22d3ee;
    font-size: 13px;
}

.header-center {
    font-size: 13px;
    color: #86efac;
}

.logout-btn {
    background: #ef4444;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.logout-btn:hover {
    background: #dc2626;
}

.container {
    max-width: 1250px;
    margin: auto;
    padding: 25px 16px;
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 15px;
}

.stats.secondary {
    margin-bottom: 25px;
}

.stat {
    background: white;
    padding: 19px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    border-left: 4px solid #2563eb;
}

.stat.green {
    border-left-color: #16a34a;
}

.stat.orange {
    border-left-color: #f59e0b;
}

.stat.red {
    border-left-color: #ef4444;
}

.stat.purple {
    border-left-color: #7c3aed;
}

.stat.cyan {
    border-left-color: #0891b2;
}

.stat h3 {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 8px;
}

.stat strong {
    font-size: 27px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: 1fr 180px 180px auto;
    gap: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.05);
}

.toolbar input,
.toolbar select {
    width: 100%;
    padding: 12px;
    border: 1px solid #dbe2ea;
    border-radius: 8px;
    font-size: 14px;
    background: white;
    outline: none;
}

.toolbar input:focus,
.toolbar select:focus {
    border-color: #2563eb;
}

.refresh-btn {
    padding: 12px 17px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-weight: 600;
}

.refresh-btn:hover {
    background: #1d4ed8;
}

/* =========================
   ORDERS
========================= */

.orders {
    display: grid;
    gap: 15px;
}

.order {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.order-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.order-id {
    font-weight: bold;
    color: #0284c7;
    font-size: 15px;
}

.order-date {
    font-size: 12px;
    color: #64748b;
    margin-top: 4px;
}

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    background: #dcfce7;
    color: #166534;
}

.customer-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
}

.customer-summary > div {
    background: #f8fafc;
    padding: 12px;
    border-radius: 8px;
}

.customer-summary strong {
    display: block;
    margin-top: 5px;
    color: #1e293b;
    word-break: break-word;
    font-size: 14px;
}

.label {
    display: block;
    color: #64748b;
    font-size: 11px;
}

.view-details-btn {
    width: 100%;
    border: none;
    background: #2563eb;
    color: white;
    padding: 11px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.view-details-btn:hover {
    background: #1d4ed8;
}

/* =========================
   DETAILS
========================= */

.order-details {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid #e2e8f0;
}

.order-details h3 {
    font-size: 15px;
    color: #1e293b;
    margin: 20px 0 10px;
}

.detail-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 10px 0;
    border-bottom: 1px solid #f1f5f9;
}

.detail-label {
    color: #64748b;
    font-size: 13px;
    font-weight: 600;
}

.detail-value {
    color: #1e293b;
    font-size: 14px;
    text-align: right;
    word-break: break-word;
}

.message-box {
    background: #f8fafc;
    border-radius: 8px;
    padding: 12px;
    color: #334155;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
}

/* =========================
   EDITOR
========================= */

.editor-box {
    background: #f8fafc;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 18px;
}

.editor-box label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #475569;
    margin: 8px 0 5px;
}

.editor-box select,
.editor-box input,
.editor-box textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: white;
    color: #1e293b;
    font-size: 14px;
    outline: none;
}

.editor-box textarea {
    min-height: 100px;
    resize: vertical;
}

.save-btn {
    width: 100%;
    border: none;
    color: white;
    padding: 11px 15px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
}

.save-status-btn {
    background: #16a34a;
}

.save-payment-btn {
    background: #2563eb;
}

.save-notes-btn {
    background: #7c3aed;
}

.loading,
.empty,
.error {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 12px;
}

.error {
    color: #dc2626;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .customer-summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .toolbar {
        grid-template-columns: 1fr 1fr;
    }

    .toolbar input {
        grid-column: 1 / -1;
    }
}

@media (max-width: 700px) {

    .header {
        flex-direction: column;
        align-items: flex-start;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .customer-summary {
        grid-template-columns: 1fr;
    }

    .toolbar {
        grid-template-columns: 1fr;
    }

    .toolbar input {
        grid-column: auto;
    }

    .detail-row {
        flex-direction: column;
        gap: 4px;
    }

    .detail-value {
        text-align: left;
    }
}

@media (max-width: 430px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .order {
        padding: 15px;
    }

    .order-top {
        align-items: flex-start;
        flex-direction: column;
    }
}

</style>
</head>

<body>

<header class="header">

    <div class="header-left">
        <h1>R&L Online Services</h1>
        <span>Admin Dashboard</span>
    </div>

    <div class="header-center">
        🟢 API Connected
    </div>

    <button
        type="button"
        onclick="logoutAdmin()"
        class="logout-btn">
        Logout
    </button>

</header>


<main class="container">

    <!-- =========================
         STATISTICS
    ========================== -->

    <section class="stats">

        <div class="stat">
            <h3>Total Orders</h3>
            <strong id="totalOrders">0</strong>
        </div>

        <div class="stat">
            <h3>New Orders</h3>
            <strong id="newOrders">0</strong>
        </div>

        <div class="stat orange">
            <h3>Payment Pending</h3>
            <strong id="paymentPendingOrders">0</strong>
        </div>

        <div class="stat green">
            <h3>Paid Orders</h3>
            <strong id="paidOrders">0</strong>
        </div>

    </section>


    <section class="stats secondary">

        <div class="stat cyan">
            <h3>Processing</h3>
            <strong id="processingOrders">0</strong>
        </div>

        <div class="stat purple">
            <h3>Client Review</h3>
            <strong id="reviewOrders">0</strong>
        </div>

        <div class="stat green">
            <h3>Completed</h3>
            <strong id="completedOrders">0</strong>
        </div>

        <div class="stat red">
            <h3>Cancelled</h3>
            <strong id="cancelledOrders">0</strong>
        </div>

    </section>


    <!-- =========================
         SEARCH
    ========================== -->

    <section class="toolbar">

        <input
            type="text"
            id="search"
            placeholder="Search Order ID, name, phone, email or service..."
        >

        <select id="statusFilter">

            <option value="ALL">
                All Order Statuses
            </option>

            <option value="NEW">NEW</option>
            <option value="QUOTATION">QUOTATION</option>
            <option value="PAYMENT_PENDING">
                PAYMENT PENDING
            </option>
            <option value="PAID">PAID</option>
            <option value="PROCESSING">
                PROCESSING
            </option>
            <option value="CLIENT_REVIEW">
                CLIENT REVIEW
            </option>
            <option value="COMPLETED">
                COMPLETED
            </option>
            <option value="CANCELLED">
                CANCELLED
            </option>

        </select>


        <select id="paymentFilter">

            <option value="ALL">
                All Payment Statuses
            </option>

            <option value="PENDING">PENDING</option>
            <option value="PAID">PAID</option>
            <option value="REFUNDED">REFUNDED</option>

        </select>


        <button
            type="button"
            onclick="loadOrders()"
            class="refresh-btn">

            🔄 Refresh

        </button>

    </section>


    <!-- =========================
         ORDERS
    ========================== -->

    <section id="orders" class="orders">

        <div class="loading">
            🔄 Loading orders...
        </div>

    </section>

</main>


<script>

/* =========================================
   API
========================================= */

const API_BASE_URL =
    "https://rl-online-services.onrender.com";


/* =========================================
   AUTH
========================================= */

function getAdminToken() {

    return sessionStorage.getItem(
        "rl_admin_token"
    );

}


function logoutAdmin() {

    sessionStorage.removeItem(
        "rl_admin_token"
    );

    window.location.replace(
        "./admin-login.html"
    );

}


const initialToken =
    getAdminToken();

if (!initialToken) {

    window.location.replace(
        "./admin-login.html"
    );

}

/* =========================================
   TOKEN EXPIRY
========================================= */

function checkTokenExpiry() {

    const token =
        getAdminToken();

    if (!token) {

        logoutAdmin();

        return;

    }

    try {

        const payload =
            JSON.parse(
                atob(
                    token.split(".")[1]
                )
            );

        const expiryTime =
            payload.exp * 1000;

        const remainingTime =
            expiryTime - Date.now();

        if (remainingTime <= 0) {

            logoutAdmin();

            return;

        }

        setTimeout(
            logoutAdmin,
            remainingTime
        );

    } catch (error) {

        console.error(
            "Invalid admin token."
        );

        logoutAdmin();

    }

}

checkTokenExpiry();


/* =========================================
   SECURITY
========================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "-";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function safeOrderId(value) {

    return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

}


/* =========================================
   GLOBAL ORDERS
========================================= */

let allOrders = [];


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders() {

    const ordersContainer =
        document.getElementById(
            "orders"
        );

    ordersContainer.innerHTML = `
        <div class="loading">
            🔄 Loading orders...
        </div>
    `;

    try {

        const token =
            getAdminToken();

        if (!token) {

            logoutAdmin();

            return;

        }

        const response =
            await fetch(
                `${API_BASE_URL}/api/orders`,
                {
                    method: "GET",
                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        if (
            response.status === 401
        ) {

            logoutAdmin();

            return;

        }


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.message ||
                "Failed to load orders."
            );

        }


        allOrders =
            Array.isArray(result.orders)
                ? result.orders
                : [];


        updateStats(
            allOrders
        );


        filterOrders();


    } catch (error) {

        console.error(
            "Load orders error:",
            error
        );

        ordersContainer.innerHTML = `
            <div class="error">

                ❌ Failed to load orders.

                <br><br>

                ${escapeHTML(
                    error.message ||
                    "Please check the API server."
                )}

            </div>
        `;

    }

}


/* =========================================
   UPDATE STATS
========================================= */

function updateStats(orders) {

    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;


    document.getElementById(
        "newOrders"
    ).textContent =
        orders.filter(
            order =>
                order.status === "NEW"
        ).length;


    document.getElementById(
        "paymentPendingOrders"
    ).textContent =
        orders.filter(
            order =>
                order.status ===
                "PAYMENT_PENDING"
        ).length;


    document.getElementById(
        "paidOrders"
    ).textContent =
        orders.filter(
            order =>
                order.status === "PAID"
        ).length;


    document.getElementById(
        "processingOrders"
    ).textContent =
        orders.filter(
            order =>
                order.status ===
                "PROCESSING"
        ).length;


    document.getElementById(
        "reviewOrders"
    ).textContent =
        orders.filter(
            order =>
                order.status ===
                "CLIENT_REVIEW"
        ).length;


    document.getElementById(
        "completedOrders"
    ).textContent =
        orders.filter(
            order =>
                order.status ===
                "COMPLETED"
        ).length;


    document.getElementById(
        "cancelledOrders"
    ).textContent =
        orders.filter(
            order =>
                order.status ===
                "CANCELLED"
        ).length;

}


/* =========================================
   FILTER
========================================= */

function filterOrders() {

    const searchInput =
        document.getElementById(
            "search"
        );

    const statusInput =
        document.getElementById(
            "statusFilter"
        );

    const paymentInput =
        document.getElementById(
            "paymentFilter"
        );


    const searchTerm =
        searchInput
            .value
            .toLowerCase()
            .trim();


    const selectedStatus =
        statusInput.value;


    const selectedPayment =
        paymentInput.value;


    const filtered =
        allOrders.filter(
            order => {

                const customer =
                    order.customer || {};

                const payment =
                    order.payment || {};


                const matchesSearch =

                    String(
                        order.orderId || ""
                    )
                    .toLowerCase()
                    .includes(
                        searchTerm
                    )

                    ||

                    String(
                        customer.fullName || ""
                    )
                    .toLowerCase()
                    .includes(
                        searchTerm
                    )

                    ||

                    String(
                        customer.phone || ""
                    )
                    .toLowerCase()
                    .includes(
                        searchTerm
                    )

                    ||

                    String(
                        customer.email || ""
                    )
                    .toLowerCase()
                    .includes(
                        searchTerm
                    )

                    ||

                    String(
                        order.service || ""
                    )
                    .toLowerCase()
                    .includes(
                        searchTerm
                    );


                const matchesStatus =

                    selectedStatus === "ALL"

                    ||

                    order.status ===
                        selectedStatus;


                const matchesPayment =

                    selectedPayment === "ALL"

                    ||

                    payment.status ===
                        selectedPayment;


                return (
                    matchesSearch &&
                    matchesStatus &&
                    matchesPayment
                );

            }
        );


    displayOrders(
        filtered
    );

}


/* =========================================
   DISPLAY ORDERS
========================================= */

function displayOrders(orders) {

    const container =
        document.getElementById(
            "orders"
        );


    if (!orders.length) {

        container.innerHTML = `
            <div class="empty">

                No orders found.

            </div>
        `;

        return;

    }


    container.innerHTML =
        orders.map(
            order => {

                const customer =
                    order.customer || {};

                const payment =
                    order.payment || {};

                const details =
                    order.serviceDetails || {};


                const detailsHTML =
                    Object.entries(
                        details
                    )
                    .map(
                        ([key, value]) => `

                            <div class="detail-row">

                                <span class="detail-label">
                                    ${escapeHTML(key)}
                                </span>

                                <span class="detail-value">
                                    ${escapeHTML(value || "-")}
                                </span>

                            </div>

                        `
                    )
                    .join("");


                const orderId =
                    String(
                        order.orderId || ""
                    );


                const jsOrderId =
                    safeOrderId(
                        orderId
                    );


                return `

                    <article class="order">

                        <div class="order-top">

                            <div>

                                <div class="order-id">

                                    ${escapeHTML(
                                        orderId ||
                                        "-"
                                    )}

                                </div>


                                <div class="order-date">

                                    ${
                                        order.createdAt

                                        ?

                                        escapeHTML(
                                            new Date(
                                                order.createdAt
                                            )
                                            .toLocaleString()
                                        )

                                        :

                                        "-"
                                    }

                                </div>

                            </div>


                            <div class="status">

                                ${escapeHTML(
                                    order.status ||
                                    "NEW"
                                )}

                            </div>

                        </div>


                        <div class="customer-summary">

                            <div>

                                <span class="label">
                                    Customer
                                </span>

                                <strong>
                                    ${escapeHTML(
                                        customer.fullName ||
                                        "-"
                                    )}
                                </strong>

                            </div>


                            <div>

                                <span class="label">
                                    Phone
                                </span>

                                <strong>
                                    ${escapeHTML(
                                        customer.phone ||
                                        "-"
                                    )}
                                </strong>

                            </div>


                            <div>

                                <span class="label">
                                    Service
                                </span>

                                <strong>
                                    ${escapeHTML(
                                        order.service ||
                                        "-"
                                    )}
                                </strong>

                            </div>


                            <div>

                                <span class="label">
                                    Payment
                                </span>

                                <strong>
                                    ${escapeHTML(
                                        payment.status ||
                                        "PENDING"
                                    )}
                                </strong>

                            </div>

                        </div>


                        <button
                            type="button"
                            class="view-details-btn"
                            onclick="showOrderDetails('${jsOrderId}')">

                            View Order Details

                        </button>


                        <div
                            class="order-details"
                            id="details-${escapeHTML(orderId)}"
                            style="display:none;"
                        >


                            <h3>
                                Customer Information
                            </h3>


                            <div class="detail-row">

                                <span class="detail-label">
                                    Full Name
                                </span>

                                <span class="detail-value">
                                    ${escapeHTML(
                                        customer.fullName ||
                                        "-"
                                    )}
                                </span>

                            </div>


                            <div class="detail-row">

                                <span class="detail-label">
                                    Phone
                                </span>

                                <span class="detail-value">
                                    ${escapeHTML(
                                        customer.phone ||
                                        "-"
                                    )}
                                </span>

                            </div>


                            <div class="detail-row">

                                <span class="detail-label">
                                    Email
                                </span>

                                <span class="detail-value">
                                    ${escapeHTML(
                                        customer.email ||
                                        "-"
                                    )}
                                </span>

                            </div>


                            <h3>
                                Service Information
                            </h3>


                            <div class="detail-row">

                                <span class="detail-label">
                                    Service
                                </span>

                                <span class="detail-value">
                                    ${escapeHTML(
                                        order.service ||
                                        "-"
                                    )}
                                </span>

                            </div>


                            ${detailsHTML}


                            <h3>
                                Order Message
                            </h3>


                            <div class="message-box">

                                ${escapeHTML(
                                    order.message ||
                                    "No message provided."
                                )}

                            </div>


                            <h3>
                                Payment
                            </h3>


                            <div class="detail-row">

                                <span class="detail-label">
                                    Payment Status
                                </span>

                                <span class="detail-value">
                                    ${escapeHTML(
                                        payment.status ||
                                        "PENDING"
                                    )}
                                </span>

                            </div>


                            <div class="detail-row">

                                <span class="detail-label">
                                    Amount
                                </span>

                                <span class="detail-value">

                                    TSh ${Number(
                                        payment.amount || 0
                                    ).toLocaleString()}

                                </span>

                            </div>


                            <div class="detail-row">

                                <span class="detail-label">
                                    Reference
                                </span>

                                <span class="detail-value">
                                    ${escapeHTML(
                                        payment.reference ||
                                        "-"
                                    )}
                                </span>

                            </div>


                            <h3>
                                Update Order Status
                            </h3>


                            <div class="editor-box">

                                <label>
                                    Order Status
                                </label>


                                <select
                                    id="status-${escapeHTML(orderId)}"
                                >

                                    <option
                                        value="NEW"
                                        ${
                                            order.status === "NEW"
                                                ? "selected"
                                                : ""
                                        }
                                    >
                                        NEW
                                    </option>


                                    <option
                                        value="QUOTATION"
                                        ${
                                            order.status === "QUOTATION"
                                                ? "selected"
                                                : ""
                                        }
                                    >
                                        QUOTATION
                                    </option>


                                    <option
                                        value="PAYMENT_PENDING"
                                        ${

                            </div>


                        </div>

                    </article>

                `;

            }
        )
        .join("");

}


/* =========================================
   UPDATE STATUS
========================================= */

async function updateOrderStatus(
    orderId
) {

    const select =
        document.getElementById(
            `status-${orderId}`
        );


    if (!select) {

        alert(
            "❌ Status field not found."
        );

        return;

    }


    const token =
        getAdminToken();


    if (!token) {

        logoutAdmin();

        return;

    }


    try {

        const response =
            await fetch(
                `${API_BASE_URL}/api/orders/${encodeURIComponent(orderId)}`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        status:
                            select.value
                    })
                }
            );


        if (
            response.status === 401
        ) {

            logoutAdmin();

            return;

        }


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.message ||
                "Failed to update status."
            );

        }


        alert(
            "✅ Order status updated successfully."
        );


        await loadOrders();


    } catch (error) {

        console.error(
            "Update status error:",
            error
        );

        alert(
            "❌ Failed to update order status."
        );

    }

}


/* =========================================
   UPDATE PAYMENT
========================================= */

async function updateOrderPayment(
    orderId
) {

    const statusElement =
        document.getElementById(
            `payment-status-${orderId}`
        );


    const amountElement =
        document.getElementById(
            `payment-amount-${orderId}`
        );


    const referenceElement =
        document.getElementById(
            `payment-reference-${orderId}`
        );


    if (
        !statusElement ||
        !amountElement ||
        !referenceElement
    ) {

        alert(
            "❌ Payment fields not found."
        );

        return;

    }


    const amount =
        Number(
            amountElement.value || 0
        );


    if (amount < 0) {

        alert(
            "❌ Amount cannot be negative."
        );

        return;

    }


    const token =
        getAdminToken();


    if (!token) {

        logoutAdmin();

        return;

    }


    try {

        const response =
            await fetch(
                `${API_BASE_URL}/api/orders/${encodeURIComponent(orderId)}`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({

                        payment: {

                            status:
                                statusElement.value,

                            amount:
                                amount,

                            reference:
                                referenceElement.value.trim()

                        }

                    })
                }
            );


        if (
            response.status === 401
        ) {

            logoutAdmin();

            return;

        }


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.message ||
                "Failed to update payment."
            );

        }


        alert(
            "✅ Payment updated successfully."
        );


        await loadOrders();


    } catch (error) {

        console.error(
            "Update payment error:",
            error
        );

        alert(
            "❌ Failed to update payment."
        );

    }

}

/* =========================================
   SHOW / HIDE DETAILS
========================================= */

function showOrderDetails(
    orderId
) {

    const details =
        document.getElementById(
            `details-${orderId}`
        );


    if (!details) {

        return;

    }


    const button =
        details.previousElementSibling;


    if (
        details.style.display ===
        "none"
    ) {

        details.style.display =
            "block";


        if (button) {

            button.textContent =
                "Hide Order Details";

        }

    } else {

        details.style.display =
            "none";


        if (button) {

            button.textContent =
                "View Order Details";

        }

    }

}
