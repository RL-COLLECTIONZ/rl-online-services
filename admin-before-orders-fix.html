<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>R&L Online Services — Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .header {
            background: #0b1220;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 21px;
        }

        .header span {
            color: #22d3ee;
            font-size: 13px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 25px 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .stat h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .stat strong {
            font-size: 28px;
        }

        .toolbar {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .toolbar input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            font-size: 14px;
        }

        .orders {
            display: grid;
            gap: 15px;
        }

        .order {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .order-id {
            font-weight: bold;
            color: #0284c7;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #dcfce7;
            color: #166534;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 14px;
        }

        .info div {
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
        }

        .label {
            display: block;
            color: #64748b;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .loading,
        .empty,
        .error {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .info {
                grid-template-columns: 1fr;
            }

            .header {
                align-items: flex-start;
                gap: 5px;
                flex-direction: column;
            }
        }
      .logout-btn {
  background: #ef4444;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s ease;
}

.logout-btn:hover {
  background: #dc2626;
}
    </style>
</head>

<body>

<header class="header">
    <div>
  <h1>R&L Online Services</h1>
  <span>Admin Dashboard</span>
</div>

<button onclick="logoutAdmin()" class="logout-btn">
  Logout
</button>

    <div>
        🟢 API Connected
    </div>
</header>

<main class="container">

    <section class="stats">
        <div class="stat">
            <h3>Total Orders</h3>
            <strong id="totalOrders">0</strong>
        </div>

        <div class="stat">
            <h3>New Orders</h3>
            <strong id="newOrders">0</strong>
        </div>

        <div class="stat">
            <h3>In Progress</h3>
            <strong id="progressOrders">0</strong>
        </div>

        <div class="stat">
            <h3>Completed</h3>
            <strong id="completedOrders">0</strong>
        </div>
    </section>

    <section class="toolbar">
        <input
            type="text"
            id="search"
            placeholder="Search by Order ID, name, phone or service..."
        >
    </section>

    <section id="orders" class="orders">
        <div class="loading">
            Loading orders...
        </div>
    </section>

</main>

<script>

  const adminToken = sessionStorage.getItem("rl_admin_token");

if (!adminToken) {
  window.location.href = "/admin-login.html";
}

function logoutAdmin() {
  sessionStorage.removeItem("rl_admin_token");
  window.location.replace("/admin-login.html");
}

// Automatically logout when JWT expires
function checkTokenExpiry() {
  const token = sessionStorage.getItem("rl_admin_token");

  if (!token) {
    logoutAdmin();
    return;
  }

  try {
    const payload = JSON.parse(atob(token.split(".")[1]));
    const expiryTime = payload.exp * 1000;
    const remainingTime = expiryTime - Date.now();

    if (remainingTime <= 0) {
      logoutAdmin();
      return;
    }

    setTimeout(logoutAdmin, remainingTime);

  } catch (error) {
    console.error("Invalid admin token.");
    logoutAdmin();
  }
}

checkTokenExpiry();
  
let allOrders = [];

async function loadOrders() {

    const ordersContainer = document.getElementById("orders");

    try {

        const token = sessionStorage.getItem("rl_admin_token");

const response = await fetch("/api/orders", {
  headers: {
    "Authorization": `Bearer ${token}`
  }
});

if (response.status === 401) {
  logoutAdmin();
  return;
}


        const result = await response.json();

if (!response.ok || !result.success) {
    throw new Error("Failed to load orders");
}

        allOrders = result.orders || [];

        updateStats(allOrders);

        displayOrders(allOrders);

    } catch (error) {

        console.error(error);

        ordersContainer.innerHTML = `
            <div class="error">
                ❌ Failed to load orders.<br>
                Make sure the R&L API server is running.
            </div>
        `;
    }
}


function updateStats(orders) {

    document.getElementById("totalOrders").textContent =
        orders.length;

    document.getElementById("newOrders").textContent =
        orders.filter(order => order.status === "NEW").length;

    document.getElementById("progressOrders").textContent =
        orders.filter(order => order.status === "IN_PROGRESS").length;

    document.getElementById("completedOrders").textContent =
        orders.filter(order => order.status === "COMPLETED").length;
}


function displayOrders(orders) {

    const container = document.getElementById("orders");

    if (!orders.length) {

        container.innerHTML = `
            <div class="empty">
                No orders found.
            </div>
        `;

        return;
    }

    container.innerHTML = orders.map(order => {

        const customer = order.customer || {};

        return `
            <article class="order">

                <div class="order-top">

                    <div class="order-id">
                        ${order.orderId}
                    </div>

                    <div class="status">
                        ${order.status || "NEW"}
                    </div>

                </div>

                <div class="info">

                    <div>
                        <span class="label">Customer</span>
                        ${customer.fullName || "-"}
                    </div>

                    <div>
                        <span class="label">Phone</span>
                        ${customer.phone || "-"}
                    </div>

                    <div>
                        <span class="label">Email</span>
                        ${customer.email || "-"}
                    </div>

                    <div>
                        <span class="label">Service</span>
                        ${order.service || "-"}
                    </div>

                    <div>
                        <span class="label">Message</span>
                        ${order.message || "-"}
                    </div>

                    <div>
                        <span class="label">Date</span>
                        ${new Date(order.createdAt).toLocaleString()}
                    </div>

                </div>

            </article>
        `;

    }).join("");
}


document.getElementById("search").addEventListener("input", function () {

    const searchTerm = this.value.toLowerCase();

    const filtered = allOrders.filter(order => {

        const customer = order.customer || {};

        return (
            (order.orderId || "").toLowerCase().includes(searchTerm) ||
            (customer.fullName || "").toLowerCase().includes(searchTerm) ||
            (customer.phone || "").toLowerCase().includes(searchTerm) ||
            (order.service || "").toLowerCase().includes(searchTerm)
        );

    });

    displayOrders(filtered);
});


loadOrders();

</script>

</body>
</html>
